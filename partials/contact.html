<style>
    .holding-socials {
        flex-direction: row !important;
        justify-content: center;
        align-items: center;
        gap: var(--inner-gap);
    }

    .holding-socials .icon {background: var(--black);}

    #contact {padding-block: calc(var(--spacing) * 5);}
    #contact .contact-copy {align-items: center; text-align: center;}
    #contact .contact-copy h5 {width: 100%; text-align: center; white-space: normal;}

    .mailing-list-form {
        display: flex;
        width: 28ch;
        max-width: 100%;
        background: var(--black);
        font: 19px 'JetBrains', monospace;
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
    }

    .mailing-list-form input {
        min-width: 0;
        flex: 1;
        border: 0;
        outline: 0;
        padding: calc(var(--spacing) / 8) calc(var(--spacing) / 2);
        background: transparent;
        color: var(--red);
        font: 19px 'JetBrains', sans-serif;
        text-align: left;
        text-transform: uppercase;
    }

    .mailing-list-form input::placeholder {color: var(--red); opacity: 1;}

    .mailing-list-form button {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        margin: 0;
        padding: 0 calc(var(--spacing) / 2);
        background: var(--black);
    }

    .mailing-list-form button img {width: 24px; height: 24px;}

    @media (min-width: 1025px) {
        .mailing-list-form {width: 316px;}
    }

</style>

<section id="contact" class="bleed red tall">
    <div class="s10 center contact-copy">
        <h2>Contact</h2>
        <h5 class="mono">For new projects:<br>
            <a href="mailto:Cat@pitchandsync.com">Cat@pitchandsync.com</a><br><br>
            For composers/music submissions:<br>
            <a href="mailto:Info@pitchandsync.com">Info@pitchandsync.com</a><br><br>
            Sign up to our mailing list:</h5>
        <form class="mailing-list-form">
            <label for="mailing-list-email" class="sr-only">Email address</label>
            <input id="mailing-list-email" name="email" type="email" placeholder="Email" autocomplete="email" required>
            <button type="submit" aria-label="Submit email address">
                <img src="../assets/icons/play.svg" alt="">
            </button>
        </form>
    </div>

    <div class="s12 center holding-socials">
        <a href="https://www.instagram.com/pitchandsync/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><div class="icon instagram"></div></a>
        <a href="https://www.linkedin.com/company/pitch-&-sync/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><div class="icon linkedin"></div></a>
    </div>
</section>
